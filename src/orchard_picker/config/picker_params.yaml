rm_json_bridge:
  ros__parameters:
    host: "192.168.1.18"
    port: 8080
    auto_connect: true
    connect_timeout: 3.0
    recv_timeout: 0.2
    response_timeout: 5.0
    motion_timeout: 60.0
    gripper_timeout: 20.0

    # EG2-4B/4C needs 9-24V power. Keep this true when it is powered by the tool end.
    set_tool_voltage_on_start: true
    tool_voltage_type: 3   # 0: 0V, 2: 12V, 3: 24V

    # Use the controller-integrated gripper protocol documented in JSON V3.2
    # section 4.8.  This avoids relying on an unverified EG2-4B2 register map.
    gripper_driver: "realman_builtin"
    # The following Modbus values are retained only as an inactive fallback.
    gripper_modbus_device: 1
    gripper_modbus_port: 1
    gripper_modbus_baudrate: 115200
    gripper_modbus_timeout: 10   # Unit: 100 ms, so 10 means 1 second.
    gripper_modbus_control_address: 10   # 10=open, 11=speed, 12=force
    gripper_modbus_status_address: 65
    gripper_release_position: 1000
    gripper_pick_position: 0
    gripper_position_force: 200
    gripper_wait_status: false

pick_task_manager:
  ros__parameters:
    driver_ns: "/rm_json_bridge"
    wait_for_driver: true

    base_frame: "base_link"
    robot_end_frame: "robot_end"
    use_tf: true
    target_pose_topic: "/apple/target_pose"
    target_point_topic: "/apple/target_point"
    # Checked only when a target is accepted. The accepted target is immediately
    # transformed into base_frame and locked for the whole pick sequence.
    target_timeout: 2.0
    target_use_latest_tf: true
    clear_target_on_success: true
    clear_target_on_failure: false
    transform_timeout: 0.5
    # Reject cached flange transforms if live arm-state polling has stopped.
    max_robot_end_tf_age: 1.0
    service_call_timeout: 90.0
    motion_verify_timeout: 20.0
    motion_position_tolerance_m: 0.005
    home_joint_tolerance_deg: 1.0
    start_on_target: false
    # Planning-only safety gate. While true, run_once/start only log the full
    # tip/end plan and never call gripper or arm motion services.
    dry_run: false

    # Direction of the last straight approach in base_frame.
    # pre_grasp = apple - approach_vector_base * approach_distance
    approach_vector_base: [1.0, 0.0, 0.0]
    # Keep the flange orientation read at task start and derive approach from
    # that orientation's tool +Z axis.
    use_current_gripper_orientation: true
    approach_along_gripper_axis: true
    approach_distance: 0.08
    retreat_distance: 0.08
    grasp_offset_base: [0.0, 0.0, 0.0]

    # Read-only get_current_arm_state on 2026-09-16.  This is the operator's
    # current posture; it was not written into the controller as a default.
    # Raw protocol joint values:
    # [-267, -26516, 101196, -159288, -98282, 210182]
    home_joint_deg: [54.402, -1.163, 86.645, 0.009, 83.259, 120.046]

    # Desired gripper-tip orientation in base_link. robot_end has the same
    # orientation because T_robot_end_gripper_tip_center has no rotation.
    gripper_tip_rpy_rad: [2.555, -0.397, 3.048]
    gripper_length_to_tip_m: 0.158
    flange_adapter_length_m: 0.010
    # Full transform from robot_end to the configured tool center.  These
    # values can be updated from the GUI while the picker is idle.
    gripper_tcp_xyz_m: [0.0005, -0.005, 0.158]
    gripper_tcp_rpy_deg: [-2.77555756156e-17, 0.0, 0.0]

    # Independent hard floor for the six URDF joint-axis endpoints and every
    # commanded robot_end pose.  This remains active even when the optional
    # project Cartesian workspace box is disabled.
    min_axis_endpoint_z_m: 0.010

    workspace_min: [0.05, -0.50, 0.02]
    workspace_max: [0.80, 0.50, 0.80]
    # RML63-BI has a controller-enforced reachable workspace and joint limits.
    # These project-specific Cartesian box limits are disabled by request.
    enforce_workspace_limits: false

    movej_p_speed: 20
    movel_speed: 18
    home_speed: 20
    twist_speed: 5
    blend_radius: 0

    gripper_release_speed: 300
    gripper_pick_speed: 150
    gripper_pick_force: 150

    twist_joint_index: 5
    enable_twist: false
    # Complete the safe sequence after gripping: retreat, return Home, release.
    stop_after_grasp: false
    twist_delta_deg: 0.0
    twist_min_deg: -360.0
    twist_max_deg: 360.0
    sleep_after_release: 0.5
    sleep_after_grip: 0.5
    sleep_after_twist: 0.2

    # A failed or aborted move must stop in place for inspection.  Automatic
    # Home recovery can create a second unplanned path around an obstacle.
    return_home_on_failure: false
    release_on_failure: false

tcp_tf_publisher:
  ros__parameters:
    driver_ns: "/rm_json_bridge"
    wait_for_driver: true
    base_frame: "base_link"
    # get_current_arm_state must report the flange/robot-end origin, with no
    # controller-side tool offset, to avoid applying the TCP twice.
    tcp_frame: "robot_end"
    publish_rate: 5.0

hand_eye_static_tf_publisher:
  ros__parameters:
    enabled: true
    # D435i calibration: camera frame pose expressed in robot_end.
    parent_frame: "robot_end"
    child_frame: "camera_link"
    invert_matrix: false
    rotation_matrix:
      [-0.85684041, -0.51514442, 0.02123071,
        0.51506258, -0.85709906, -0.00957856,
        0.02313116, 0.00272785, 0.99972872]
    translation_m: [0.0757663, 0.0625736, 0.01734084]

gripper_tcp_static_tf_publisher:
  ros__parameters:
    enabled: true
    parent_frame: "robot_end"
    child_frame: "gripper_tip_center"
    gripper_length_to_tip_m: 0.158
    flange_adapter_length_m: 0.010
    gripper_tcp_xyz_m: [0.0005, -0.005, 0.158]
    gripper_tcp_rpy_deg: [-2.77555756156e-17, 0.0, 0.0]

fake_apple_target:
  ros__parameters:
    topic: "/apple/target_pose"
    frame_id: "base_link"
    rate: 2.0

    # Debug apple center chosen so its compensated pre-grasp robot_end pose is
    # the safe pose above for the configured 0.168 m tip offset.
    x: 0.325671
    y: -0.238075
    z: 0.706687
    roll: 0.782
    pitch: 0.409
    yaw: 1.043
